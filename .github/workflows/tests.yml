name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build ruff
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: python -m build
      - run: python examples/generate_demo.py
      - run: frame-workbench build examples/directory.json --output examples/output-directory
      - run: frame-workbench build examples/zip.json --output examples/output-zip
      - run: frame-workbench build examples/sheet.json --output examples/output-sheet
      - run: frame-workbench build examples/analysis.json --output examples/output-analysis
